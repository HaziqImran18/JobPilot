[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobpilot"
version = "0.2.0"
description = "An MCP-powered job search agent with a production-style harness and persistent memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JobPilot" }]
keywords = ["ai-agents", "mcp", "job-search", "llm", "harness"]
dependencies = [
  "flask>=3.0,<4",
  "waitress>=3.0,<4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
  "feedparser>=6.0,<7",
  "mcp>=1.2,<2",
  "openai>=1.40,<2",
  "numpy>=1.26,<3",
  "python-dateutil>=2.9,<3",
  "beautifulsoup4>=4.12,<5",
  "pypdf>=4,<6",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
eval = [
  "scikit-learn>=1.5,<2",
]
browser = [
  "playwright>=1.45,<2",
]
local-embeddings = [
  "sentence-transformers>=3.0,<4",
]

[project.scripts]
jobpilot = "jobpilot.ui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
